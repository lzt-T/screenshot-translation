name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release-windows:
    name: Release Windows x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository and LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Release tag must use the stable version format vX.Y.Z: $tag"
          }

          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $expectedTag = "v$packageVersion"
          if ($tag -cne $expectedTag) {
            throw "Release tag $tag does not match package.json version $packageVersion"
          }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        shell: pwsh
        env:
          MAIN_VITE_GML_FREE_API_KEY: ${{ secrets.MAIN_VITE_GML_FREE_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MAIN_VITE_GML_FREE_API_KEY)) {
            throw 'MAIN_VITE_GML_FREE_API_KEY secret is not configured'
          }

          pnpm exec electron-vite build

          $mainBundle = Get-Content 'out/main/index.js' -Raw
          if (-not $mainBundle.Contains($env:MAIN_VITE_GML_FREE_API_KEY)) {
            throw 'MAIN_VITE_GML_FREE_API_KEY was not injected into the main bundle'
          }

      - name: Build Windows installer
        run: pnpm exec electron-builder --win nsis --x64 --publish never

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $assets = @(
            "dist/Bai_Ze-$packageVersion-setup.exe",
            "dist/Bai_Ze-$packageVersion-setup.exe.blockmap",
            'dist/latest.yml'
          )
          $missingAssets = $assets | Where-Object { -not (Test-Path $_) }
          if ($missingAssets) {
            throw "Release assets are missing: $($missingAssets -join ', ')"
          }

          gh release create $env:RELEASE_TAG $assets `
            --generate-notes `
            --title $env:RELEASE_TAG `
            --verify-tag
